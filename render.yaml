services:
  - type: web
    name: medimitra
    env: python
    buildCommand: pip install -r requirements.txt && flask --app app create-admin
    startCommand: gunicorn app:app --workers 4 --bind 0.0.0.0:$PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: AI_PROVIDER
        value: gemini
